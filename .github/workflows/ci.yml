name: ci

# Lint, tests and the container check on every push and pull request. Read-only: no secrets, no write permissions.
# The container job runs the same steps as scripts/accept.sh (keep the two in step).

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go tool staticcheck ./...
      - name: exhaustive
        run: go tool exhaustive ./...
      - name: tests
        run: go test -race -count=1 -json -coverprofile=coverage.out ./... > test.json
      # The report goes to the run's summary page; failed tests are also marked on the run page and in the diff.
      - name: test report
        if: ${{ !cancelled() && hashFiles('test.json') != '' }}
        run: go run ./scripts/testreport -annotate < test.json >> "$GITHUB_STEP_SUMMARY"
      - name: keep the test results
        if: ${{ !cancelled() && hashFiles('test.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            test.json
            coverage.out
          retention-days: 30

  container:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_FILE: scripts/accept.compose.yaml
      COMPOSE_PROJECT_NAME: gdelt-lake-ci
      COMPOSE_PROFILES: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build
        run: docker compose build --pull
      - name: fake GDELT
        run: docker compose up -d --wait --wait-timeout 60 fake-gdelt
      - name: ingester (one run)
        run: docker compose run --rm ingester
      - name: verify the lake
        run: docker compose run --rm verify
      - name: logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: tear down
        if: always()
        run: docker compose down -v --remove-orphans
