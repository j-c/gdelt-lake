name: ci

# Lint, tests and the container check on every push and pull request. Read-only: no secrets, no write permissions.
# Images are published by publish.yml.
# The container job runs the same steps as scripts/accept.sh (keep the two in step).

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go tool staticcheck ./...
      - name: exhaustive
        run: go tool exhaustive ./...
      # Everything compiled into the binary must be under a licence that lets the image be published (no GPL-style
      # or unknown licences). The image carries their texts (Dockerfile).
      - name: licences
        run: go tool go-licenses check ./cmd/gdelt-lake --disallowed_types=forbidden,restricted,unknown 2>licences.log || { cat licences.log; exit 1; }
      # The Azure storage adapter's contract tests run against the Azurite emulator, with a throwaway account key
      # made up for this run.
      - name: azurite
        run: |
          key=$(openssl rand -base64 64 | tr -d '\n')
          echo "::add-mask::$key"
          docker run -d --name azurite -p 127.0.0.1:10000:10000 -e "AZURITE_ACCOUNTS=lake:$key" \
            mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          for i in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:10000/ && break; sleep 1; done
          echo "GDELT_LAKE_AZURITE=DefaultEndpointsProtocol=http;AccountName=lake;AccountKey=$key;BlobEndpoint=http://127.0.0.1:10000/lake;" >> "$GITHUB_ENV"
      - name: tests
        run: go test -race -count=1 -json -coverprofile=coverage.out ./... > test.json
      # The report goes to the run's summary page; failed tests are also marked on the run page and in the diff.
      - name: test report
        if: ${{ !cancelled() && hashFiles('test.json') != '' }}
        run: go run ./scripts/testreport -annotate < test.json >> "$GITHUB_STEP_SUMMARY"
      - name: keep the test results
        if: ${{ !cancelled() && hashFiles('test.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            test.json
            coverage.out
          retention-days: 30

  # The Azure recipe compiles and passes the Bicep linter (deploy/azure/bicepconfig.json); warnings fail the job.
  bicep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BICEP_VERSION: v0.49.2
      BICEP_SHA256: 0ab9de90c2493f206f8281bae74f9ee2d5ed3605548dab1adf41fef185e1f7c5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install bicep
        run: |
          curl -sSfL -o bicep "https://github.com/Azure/bicep/releases/download/$BICEP_VERSION/bicep-linux-x64"
          echo "$BICEP_SHA256  bicep" | sha256sum -c -
          chmod +x bicep
      - name: lint and build
        working-directory: deploy/azure
        run: |
          out=$(../../bicep lint main.bicep 2>&1); echo "$out"
          test -z "$out"
          ../../bicep build main.bicep --stdout > /dev/null
          ../../bicep build-params main.example.bicepparam --stdout > /dev/null

  # Secrets (keys, tokens, passwords) anywhere in the history, with Gitleaks' built-in rules (.gitleaks.toml).
  # Findings are reported without the matched text.
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks && rm gitleaks.tar.gz
      - name: scan the full history
        run: |
          status=0
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --log-opts=--all \
            --exit-code 3 --report-format json --report-path "$RUNNER_TEMP/leaks.json" || status=$?
          [ "$status" = 0 ] || [ "$status" = 3 ] || exit "$status"
          {
            echo "## Secret scan (Gitleaks)"
            echo
            if [ "$status" = 0 ]; then
              echo "No findings in $(git rev-list --all --count) commits."
            else
              echo "| Rule | File | Line | Commit |"
              echo "|---|---|---:|---|"
              jq -r '.[] | "| \(.RuleID) | `\(.File)` | \(.StartLine) | \(.Commit[0:7]) |"' "$RUNNER_TEMP/leaks.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" = 3 ]; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine),title=\(.RuleID)::possible secret (commit \(.Commit[0:7]))"' \
              "$RUNNER_TEMP/leaks.json"
            exit 1
          fi

  container:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_FILE: scripts/accept.compose.yaml
      COMPOSE_PROJECT_NAME: gdelt-lake-ci
      COMPOSE_PROFILES: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build
        run: docker compose build --pull
      - name: fake GDELT
        run: docker compose up -d --wait --wait-timeout 60 fake-gdelt
      - name: ingester (one run)
        run: docker compose run --rm ingester
      - name: verify the lake
        run: docker compose run --rm verify
      - name: licences in the image
        run: scripts/image-licences.sh "$COMPOSE_PROJECT_NAME-ingester"
      - name: logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: tear down
        if: always()
        run: docker compose down -v --remove-orphans
